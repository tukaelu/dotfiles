# -------------------------------------------------------------------
# Session options
# -------------------------------------------------------------------

# Status-Bar position
#set-option -g status-position top

if-shell "uname | grep -q Darwin" \
  "set-option -g default-shell /opt/homebrew/bin/zsh"
if-shell "uname | grep -q Linux" \
  "set-option -g default-shell /usr/bin/fish"

if-shell "uname | grep -q Darwin" \
  "set-option -g default-command \"which reattach-to-user-namespace > /dev/null &&  reattach-to-user-namespace -l $SHELL || $SHELL\"" ""
set-option -s escape-time 0

# Change bind key to ctrl-t
unbind-key C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# Index starts from 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when a window is closed
set-option -g renumber-windows on

# History
set-option -g history-limit 102400

# Repeat time limit (ms)
set-option -g repeat-time 500

# 256-color terminal
set-option -g default-terminal "tmux-256color"

# Add truecolor support (tmux info | grep Tc)
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Key binding in the status line (bind-key :)
set-option -g status-keys emacs

# Mouse
set-option -g mouse on

# Rename off
set-option -g allow-rename off

# -------------------------------------------------------------------
# Window options
# -------------------------------------------------------------------
# Copy-mode
set-window-option -g mode-keys vi

# -------------------------------------------------------------------
# Pane options
# -------------------------------------------------------------------
# Selection interval
set-option -g display-panes-time 10000

# -------------------------------------------------------------------
# Key bindings
# -------------------------------------------------------------------
# prefix t
bind-key t new-window -c "#{pane_current_path}"

#bind-key Space run-shell "fish -c fzf_select_ghq_repo_with_tmux"
#bind-key s run-shell "fish -c fzf_tmux_session"

# prefix ctrl-a
bind-key c-a last-window

# prefix a
bind-key a send-prefix

# prefix |
bind-key | split-window -h -c "#{pane_current_path}"

# prefix -
bind-key - split-window -c "#{pane_current_path}"

# Moving windows
bind-key -r > swap-window -t :+
bind-key -r < swap-window -t :-

# Pane number
bind-key C-p display-panes

# Pane-movement
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U
bind-key tab select-pane -t :.+
bind-key btab select-pane -t :.-

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window-movement
bind -n S-Left  previous-window
bind -n S-Right next-window

# Synchronize panes
bind-key * set-window-option synchronize-pane

# Reload ~/.tmux.conf
bind-key R source-file ~/.tmux.conf \; display-message "Reloaded!"

# copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send -X copy-pipe \"reattach-to-user-namespace pbcopy\"" ""
if-shell "uname | grep -q Linux" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"xsel -i -p && xsel -o -p | xsel -i -b\""

unbind -T copy-mode-vi Enter
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi Enter send -X copy-pipe \"reattach-to-user-namespace pbcopy\"" ""
if-shell "uname | grep -q Linux" \
  "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \"xsel -i -p && xsel -o -p | xsel -i -b\""

# Clear scrollback buffer
bind-key C-l send-keys C-l \; clear-history

bind-key ] run-shell "tmux list-sessions | fzf-tmux -p | sed 's/:.*$//' | xargs tmux switch -t"
bind-key K run-shell "tmux list-sessions | fzf-tmux -p | sed 's/:.*$//' | xargs -n 1 tmux kill-session -t"

# -------------------------------------------------------------------
# Theme
# -------------------------------------------------------------------
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-show-powerline true

# -------------------------------------------------------------------
# Plug-in
# -------------------------------------------------------------------
#
# Requirements:
#  - Install Tmux Plugin Manager
#    @see https://github.com/tmux-plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Nybkox/tmux-kanagawa'
# set -g @plugin 'arcticicestudio/nord-tmux'
# set -g @plugin 'egel/tmux-gruvbox'

run '~/.tmux/plugins/tpm/tpm'
