[scrolling]
history = 10000
multiplier = 3

[shell]
args = ["-l"]
program = "/bin/zsh"

[window]
dynamic_padding = false
opacity = 0.975

[window.dimensions]
columns = 160
lines = 40

[window.padding]
x = 16
y = 16
