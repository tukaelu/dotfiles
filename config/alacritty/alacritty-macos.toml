live_config_reload = true

[[colors.indexed_colors]]
color = "0xb6927b"
index = 16

[[colors.indexed_colors]]
color = "0xb98d7b"
index = 17

[colors.bright]
black = "0xa6a69c"
blue = "0x7fb4ca"
cyan = "0x7aa89f"
green = "0x87a987"
magenta = "0x938aa9"
red = "0xe46876"
white = "0xc5c9c5"
yellow = "0xe6c384"

[colors.normal]
black = "0x0d0c0c"
blue = "0x8ba4b0"
cyan = "0x8ea4a2"
green = "0x8a9a7b"
magenta = "0xa292a3"
red = "0xc4746e"
white = "0xc8c093"
yellow = "0xc4b28a"

[colors.primary]
background = "0x181616"
foreground = "0xc5c9c5"

[colors.selection]
background = "0x2d4f67"
foreground = "0xc8c093"

[env]
TERM = "xterm-256color"

[font]
size = 16

[font.bold]
family = "PlemolJP35 Console NF"
style = "Bold"

[font.normal]
family = "PlemolJP35 Console NF"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[shell]
args = ["-l"]
program = "/bin/zsh"

[window]
dynamic_padding = false
opacity = 0.825

[window.dimensions]
columns = 160
lines = 40

[window.padding]
x = 16
y = 16
