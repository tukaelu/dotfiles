#
#
#

scrolling:
  history: 10000
  multiplier: 3

font:
  normal:
    family: Cica
    style: Regular
  bold:
    family: Cica
    style: Bold
  size: 9
  offset:
    y: 1
  use_thin_strokes: true

shell:
  program: /usr/bin/fish
  args:
    - -c
    - "/usr/bin/tmux a -t 0 > /dev/null 2>&1 || /usr/bin/tmux"
