#
live_config_reload: true

env:
  TERM: xterm-256color

scrolling:
  history: 10000
  multiplier: 3

font:
  normal:
    family: Cica
    style: Bold
  size: 9

window:
  opacity: 0.8
  padding:
    x: 18
    y: 16
  dynamic_padding: false
  # decorations: buttonless # for macOS

shell:
  program: /usr/bin/fish
  args:
    - -c
    - "/usr/bin/tmux a -t 0 > /dev/null 2>&1 || /usr/bin/tmux"
