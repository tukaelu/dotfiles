# ============================================================================
# Font Configuration
# ============================================================================
# Font settings for Ghostty terminal.
# Official Documentation: https://ghostty.org/docs/config/reference
# List available fonts: ghostty +list-fonts
# ============================================================================

# ----------------------------------------------------------------------------
# Font Family
# ----------------------------------------------------------------------------
# Specifies the primary font family for terminal text.
# Supports multiple fallback fonts separated by commas for language/symbol coverage.
# Default: JetBrains Mono (embedded in Ghostty)
#
# Examples:
#   font-family = JetBrains Mono
#   font-family = "Cascadia Code", "Noto Sans Mono"
#   font-family = "SF Mono", monospace
#
# Note: Ghostty has built-in Nerd Fonts support, so glyph characters and
# CLI tools like Starship prompt work out-of-the-box.
font-family = "HackGen Console NF"

# Font family for bold text.
# Set to 'false' to disable bold font variant (use synthetic bold instead).
# Default: Same as font-family with bold style
# font-family-bold =

# Font family for italic text.
# Set to 'false' to disable italic font variant.
# Default: Same as font-family with italic style
# font-family-italic =

# Font family for bold+italic text.
# Set to 'false' to disable bold-italic font variant.
# Default: Same as font-family with bold-italic style
# font-family-bold-italic =

# ----------------------------------------------------------------------------
# Font Size
# ----------------------------------------------------------------------------
# Font size measured in points (accepts decimal values).
# Calculation: points × pixels-per-point = pixel size
# Example: 13.5pt on 2px/pt display = 27px
#
# Note: Runtime changes only affect newly created terminal windows,
# not existing ones.
# Default: System-dependent (typically 12-13pt)
font-size = 16

# ----------------------------------------------------------------------------
# Font Style
# ----------------------------------------------------------------------------
# Explicitly specify font style names for variants.
# Useful for fonts with named styles like "Iosevka Heavy" or "Light".
#
# Examples:
#   font-style = Regular
#   font-style-bold = Heavy
#   font-style-italic = Italic
#   font-style-bold-italic = Heavy Italic
#
# Set to 'false' to disable a specific style variant.
# font-style =
# font-style-bold =
# font-style-italic =
# font-style-bold-italic =

# ----------------------------------------------------------------------------
# Synthetic Font Styles
# ----------------------------------------------------------------------------
# Controls whether Ghostty generates synthetic bold/italic when native
# font variants are unavailable.
#
# Disable specific synthetic styles:
#   font-synthetic-style = no-bold
#   font-synthetic-style = no-italic
#   font-synthetic-style = no-bold-italic
#
# Multiple values can be combined:
#   font-synthetic-style = no-bold, no-italic
#
# Default: All synthetic styles enabled
# font-synthetic-style =

# ----------------------------------------------------------------------------
# Font Thickening
# ----------------------------------------------------------------------------
# Makes fonts appear slightly thicker/bolder for better readability.
# Useful for fonts that appear thin on high-DPI displays.
# Default: false
# font-thicken = false

# ----------------------------------------------------------------------------
# Font Features (OpenType)
# ----------------------------------------------------------------------------
# Apply OpenType font features to customize glyph rendering.
# Common use case: Disabling ligatures
#
# Syntax:
#   feat      - Enable feature with default value
#   +feat     - Explicitly enable feature
#   -feat     - Disable feature
#   feat=N    - Enable feature with specific value
#
# Common features:
#   -liga     Disable standard ligatures (!=, ->, >=, etc.)
#   -dlig     Disable discretionary ligatures
#   -calt     Disable contextual alternates
#   +ss01     Enable stylistic set 01
#   +cv01     Enable character variant 01
#
# Examples:
#   font-feature = -liga
#   font-feature = -liga, -calt
#   font-feature = +ss01, +ss02
#
# Note: Since Ghostty v1.2.0, ligatures are disabled by default.
# To enable ligatures, use: font-feature = +liga, +calt
# font-feature = -liga

# Font features specifically for bold text.
# Inherits from font-feature if not specified.
# font-feature-bold =

# Font features specifically for italic text.
# Inherits from font-feature if not specified.
# font-feature-italic =

# Font features specifically for bold-italic text.
# Inherits from font-feature if not specified.
# font-feature-bold-italic =

# ----------------------------------------------------------------------------
# Font Codepoint Map (Advanced)
# ----------------------------------------------------------------------------
# Override specific Unicode codepoints to use different fonts.
# Useful for ensuring specific symbols render with preferred fonts.
#
# Syntax: font-codepoint-map = U+START-END=Font Name
#
# Examples:
#   font-codepoint-map = U+0020-007E=JetBrains Mono
#   font-codepoint-map = U+2190-21FF=Symbols Nerd Font
#   font-codepoint-map = U+4E00-9FFF=Noto Sans CJK JP
#
# Common Unicode ranges:
#   U+0020-007E  Basic Latin (ASCII)
#   U+2190-21FF  Arrows
#   U+2200-22FF  Mathematical Operators
#   U+2580-259F  Block Elements
#   U+E000-F8FF  Private Use Area (often used by icon fonts)
#   U+4E00-9FFF  CJK Unified Ideographs
# font-codepoint-map =

# ----------------------------------------------------------------------------
# Font Variations (Variable Fonts)
# ----------------------------------------------------------------------------
# Control variable font axes for fonts that support OpenType variations.
# Common axes: wght (weight), wdth (width), slnt (slant), ital (italic)
#
# Syntax: font-variation = axis=value
#
# Examples:
#   font-variation = wght=450
#   font-variation = wdth=90
#
# Multiple values:
#   font-variation = wght=450, wdth=90
# font-variation =
# font-variation-bold =
# font-variation-italic =
# font-variation-bold-italic =
