# ============================================================================
# Appearance & Theme Configuration
# ============================================================================
# Visual styling for Ghostty terminal including colors, themes, cursor,
# and background effects.
# Official Documentation: https://ghostty.org/docs/config/reference
# List available themes: ghostty +list-themes
# ============================================================================

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
# Built-in or custom color scheme for the terminal.
#
# IMPORTANT: Since Ghostty v1.2.0, theme names changed from kebab-case to
# Title Case with spaces.
#   Old format: catppuccin-mocha
#   New format: Catppuccin Mocha
#
# Popular themes:
#   - Kanagawa Wave (dark), Kanagawa Dragon (dark)
#   - Catppuccin Mocha, Catppuccin Latte, Catppuccin Frappe
#   - Tokyo Night, Tokyo Night Storm, Tokyo Night Light
#   - Dracula, Dracula Plus
#   - Gruvbox Dark, Gruvbox Light
#   - Solarized Dark, Solarized Light
#   - Nord
#   - Rose Pine, Rose Pine Dawn, Rose Pine Moon
#   - One Dark, One Light
#
# Automatic light/dark mode switching:
#   theme = light:Rose Pine Dawn,dark:Rose Pine Moon
#
# Custom theme file:
#   theme = /path/to/custom-theme
#   Theme search locations:
#     - ~/.config/ghostty/themes/
#     - System resources directory
#
# List all available themes:
#   ghostty +list-themes
#
# Default: System-dependent
theme = Kanagawa Dragon

# ----------------------------------------------------------------------------
# Base Colors
# ----------------------------------------------------------------------------
# Override base background and foreground colors.
# These settings override theme colors if specified.
#
# Format: Hexadecimal (#RRGGBB) or named X11 colors
# Examples:
#   background = #282c34
#   background = black
#   foreground = #abb2bf
#   foreground = white
#
# Note: Leave commented to use theme colors
# background =
# foreground =

# ----------------------------------------------------------------------------
# Color Palette (256 Colors)
# ----------------------------------------------------------------------------
# Override specific colors in the 256-color terminal palette.
# Format: palette = INDEX=COLOR
# Index range: 0-255
#
# Standard colors (0-15):
#   0-7:   Normal colors (black, red, green, yellow, blue, magenta, cyan, white)
#   8-15:  Bright colors
#
# Extended colors (16-255):
#   16-231: 6×6×6 color cube
#   232-255: Grayscale ramp
#
# Examples:
#   palette = 0=#282c34
#   palette = 1=#e06c75
#   palette = 0x0A=#61afef  (hexadecimal index)
#   palette = 0b1010=#98c379 (binary index)
# palette =

# ----------------------------------------------------------------------------
# Cursor
# ----------------------------------------------------------------------------
# Cursor style: block, bar, underline, block_hollow
# Default: block
# Note: Terminal programs may override this via escape sequences
cursor-style = block

# Cursor blinking behavior.
# Values:
#   true  - Always blink
#   false - Never blink
#   (empty/commented) - Respect DEC Mode 12 (application control)
# Default: Respects DEC Mode 12
# cursor-style-blink =

# Cursor color.
# Special values:
#   cell-foreground - Use the foreground color of the cell under cursor
#   cell-background - Use the background color of the cell under cursor
# Format: Hexadecimal (#RRGGBB) or special values
# Default: Auto-selected based on theme
# cursor-color =

# Cursor text color (the character under the cursor).
# Special values: Same as cursor-color
# Default: Auto-selected based on theme
# cursor-text =

# Invert cursor colors in light/dark mode for better visibility.
# Default: true
# cursor-invert-color-in-light-mode = true

# Click to move cursor (Alt+click on macOS: Option+click).
# Requires shell integration (OSC 133 support).
# Default: true
# cursor-click-to-move = true

# ----------------------------------------------------------------------------
# Selection Colors
# ----------------------------------------------------------------------------
# Colors for selected text.
# Special values: cell-foreground, cell-background
# Default: Auto-selected based on theme
# selection-foreground =
# selection-background =

# Invert selection colors in light/dark mode.
# Default: true
# selection-invert-color-in-light-mode = true

# ----------------------------------------------------------------------------
# Background Effects
# ----------------------------------------------------------------------------
# Background opacity (transparency level).
# Range: 0.0 (fully transparent) to 1.0 (fully opaque)
# Default: 1.0 (opaque)
#
# Note: Requires compositor support on Linux/BSD
background-opacity = 0.85

# Background blur radius (macOS only).
# Range: 0 (no blur) to higher values for more blur
# Default: 0
# Note: Can impact performance
# background-blur-radius = 0

# Background image (PNG or JPEG only).
# Available since: v1.2.0
# Format: /path/to/image.png
# Note: Applied per-terminal, not per-split
# background-image =

# Background image opacity.
# Range: 0.0 (invisible) to 1.0 (fully visible)
# Default: 1.0
# background-image-opacity = 1.0

# Background image positioning.
# Values: center, top, bottom, left, right, top-left, top-right,
#         bottom-left, bottom-right
# Default: center
# background-image-position = center

# Background image fit/scaling.
# Values:
#   contain - Scale to fit within terminal, maintaining aspect ratio
#   cover   - Scale to cover terminal, may crop image
#   fill    - Stretch to fill terminal, may distort
# Default: contain
# background-image-fit = contain

# Background image repeat pattern.
# Values:
#   no-repeat - Single image, no repetition
#   repeat    - Tile horizontally and vertically
#   repeat-x  - Tile horizontally only
#   repeat-y  - Tile vertically only
# Default: no-repeat
# background-image-repeat = no-repeat

# ----------------------------------------------------------------------------
# Alpha Blending
# ----------------------------------------------------------------------------
# Color space for alpha blending (transparency calculations).
# Values:
#   native          - Platform default (sRGB on macOS, linear-corrected elsewhere)
#   linear          - Linear color space (mathematically correct)
#   linear-corrected - Linear with gamma correction
#
# Default: native
# Available since: v1.1.0
# alpha-blending = native

# ----------------------------------------------------------------------------
# Minimum Contrast
# ----------------------------------------------------------------------------
# Ensure minimum contrast ratio between foreground and background.
# Range: 1.0 (no adjustment) to 21.0 (maximum contrast)
# Recommended: 4.5 for WCAG AA compliance, 7.0 for AAA
# Default: 1.0 (disabled)
#
# Note: Only adjusts foreground colors, not background
# minimum-contrast = 1.0

# ----------------------------------------------------------------------------
# Unfocused Split Appearance
# ----------------------------------------------------------------------------
# Dim or desaturate unfocused splits for better focus indication.
#
# Dim amount for unfocused splits.
# Range: 0.0 (no dimming) to 1.0 (fully dimmed)
# Default: 0.0
# unfocused-split-opacity = 0.0

# Desaturation amount for unfocused splits.
# Range: 0.0 (no desaturation) to 1.0 (grayscale)
# Default: 0.0
# unfocused-split-desaturation = 0.0

# ----------------------------------------------------------------------------
# Mouse Cursor Styling
# ----------------------------------------------------------------------------
# Hide mouse cursor while typing.
# Default: false
# mouse-hide-while-typing = false

# Change cursor appearance when hovering over clickable text.
# Default: true
# mouse-shift-capture-click = true

# ----------------------------------------------------------------------------
# Window Background (Linux/BSD)
# ----------------------------------------------------------------------------
# Use a solid color for window background instead of terminal background.
# Useful for terminals with transparency to avoid artifacts.
# Default: false
# window-background = false

# ----------------------------------------------------------------------------
# Clipboard Formatting
# ----------------------------------------------------------------------------
# Copy formatting (colors, styles) along with text to clipboard.
# Default: true
# clipboard-copy-format = true

# Trim trailing whitespace when copying to clipboard.
# Default: false
# clipboard-trim-trailing-spaces = false

# Ask for confirmation before pasting text containing newlines.
# Prevents accidental command execution.
# Default: true
# clipboard-paste-protection = true

# Bracketed paste mode support.
# When enabled, pasted text is wrapped in escape sequences so applications
# can distinguish pasted text from typed text.
# Default: true
# clipboard-paste-bracketed-safely = true
