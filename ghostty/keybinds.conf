# ============================================================================
# Key Bindings Configuration
# ============================================================================
# Custom keyboard shortcuts for Ghostty terminal.
# Official Documentation: https://ghostty.org/docs/config/reference
# ============================================================================

# ----------------------------------------------------------------------------
# Keybinding Syntax
# ----------------------------------------------------------------------------
# Format: keybind = TRIGGER=ACTION
#
# TRIGGER Components:
#   - Modifiers: shift, ctrl, alt (option on macOS), super (cmd on macOS)
#   - Keys: Physical keys (KeyA, KeyB, F1, Enter) or Unicode (a, b, 1, !)
#
# Examples:
#   keybind = ctrl+shift+t=new_tab
#   keybind = super+KeyN=new_window
#   keybind = alt+KeyA=text:Hello World
#
# Physical Keys (W3C codes - layout-independent):
#   KeyA-KeyZ, Digit0-Digit9, F1-F12, Enter, Space, Tab, Escape,
#   Backspace, Delete, Home, End, PageUp, PageDown,
#   ArrowUp, ArrowDown, ArrowLeft, ArrowRight
#
# Unicode Keys (layout-dependent):
#   a-z, 0-9, symbols (depends on keyboard layout)
#
# Special Prefixes:
#   global:          System-wide keybinding (macOS, some Linux DEs)
#   all:             Apply to all surfaces/contexts
#   unconsumed:      Don't consume the input (pass through)
#   performable:     Only trigger if action is available
#
# Leader Keys (Sequences):
#   keybind = ctrl+a>n=new_tab  (Press Ctrl+A, then N)
#   keybind = ctrl+a>t=new_window
#
# Clear/Unbind:
#   keybind = ctrl+shift+t=ignore  (Disable keybinding)
#   keybind = ctrl+shift+t=unbind  (Remove keybinding completely)

# ----------------------------------------------------------------------------
# Window Management
# ----------------------------------------------------------------------------
# Create new window
keybind = super+n=unbind

# Close current window
keybind = super+shift+w=unbind

# Toggle fullscreen
# keybind = super+ctrl+KeyF=toggle_fullscreen

# Minimize window (macOS)
# keybind = super+KeyM=minimize_window

# Hide window (macOS)
# keybind = super+KeyH=hide_window

# Hide other windows (macOS)
# keybind = super+alt+KeyH=hide_other_windows

# ----------------------------------------------------------------------------
# Tab Management
# ----------------------------------------------------------------------------
# New tab
keybind = super+t=unbind

# Close tab
keybind = super+w=unbind

# Next tab
# keybind = super+shift+BracketRight=next_tab
# keybind = ctrl+Tab=next_tab

# Previous tab
# keybind = super+shift+BracketLeft=previous_tab
# keybind = ctrl+shift+Tab=previous_tab

# Go to specific tab (1-9)
# keybind = super+Digit1=goto_tab:1
# keybind = super+Digit2=goto_tab:2
# keybind = super+Digit9=goto_tab:9

# Move tab left/right
# keybind = super+shift+ArrowLeft=move_tab:-1
# keybind = super+shift+ArrowRight=move_tab:1

# ----------------------------------------------------------------------------
# Split Management
# ----------------------------------------------------------------------------
# New split (horizontal/vertical)
# keybind = super+KeyD=new_split:right
# keybind = super+shift+KeyD=new_split:down
# keybind = super+shift+Backslash=new_split:auto

# Close split
# keybind = super+shift+KeyW=close_surface

# Navigate between splits
# keybind = super+ctrl+ArrowLeft=goto_split:left
# keybind = super+ctrl+ArrowRight=goto_split:right
# keybind = super+ctrl+ArrowUp=goto_split:top
# keybind = super+ctrl+ArrowDown=goto_split:bottom

# Navigate splits (previous/next)
# keybind = super+ctrl+BracketLeft=goto_split:previous
# keybind = super+ctrl+BracketRight=goto_split:next

# Resize splits
# keybind = super+ctrl+shift+ArrowLeft=resize_split:left,10
# keybind = super+ctrl+shift+ArrowRight=resize_split:right,10
# keybind = super+ctrl+shift+ArrowUp=resize_split:up,10
# keybind = super+ctrl+shift+ArrowDown=resize_split:down,10

# Equalize split sizes
# keybind = super+ctrl+shift+Equal=equalize_splits

# Toggle split zoom (maximize current split)
# keybind = super+ctrl+shift+Enter=toggle_split_zoom

# ----------------------------------------------------------------------------
# Scrolling & Navigation
# ----------------------------------------------------------------------------
# Scroll up/down by line
# keybind = shift+PageUp=scroll_page_lines:-1
# keybind = shift+PageDown=scroll_page_lines:1

# Scroll up/down by page
# keybind = PageUp=scroll_page_lines:-0.5
# keybind = PageDown=scroll_page_lines:0.5

# Scroll to top/bottom
# keybind = super+Home=scroll_to_top
# keybind = super+End=scroll_to_bottom

# Jump to previous/next prompt (requires shell integration)
# keybind = super+ArrowUp=jump_to_prompt:-1
# keybind = super+ArrowDown=jump_to_prompt:1

# ----------------------------------------------------------------------------
# Search
# ----------------------------------------------------------------------------
# Open search
# keybind = super+KeyF=search

# Find next/previous match
# keybind = super+KeyG=search:next
# keybind = super+shift+KeyG=search:previous

# ----------------------------------------------------------------------------
# Copy & Paste
# ----------------------------------------------------------------------------
# Copy to clipboard
# keybind = super+KeyC=copy_to_clipboard

# Paste from clipboard
# keybind = super+KeyV=paste_from_clipboard

# Copy/paste selection (X11 primary selection on Linux)
# keybind = shift+Insert=paste_from_selection
# keybind = ctrl+Insert=copy_to_selection

# ----------------------------------------------------------------------------
# Text Manipulation
# ----------------------------------------------------------------------------
# Send literal text
# keybind = ctrl+shift+KeyH=text:Hello World

# Send special keys
# keybind = ctrl+shift+Enter=text:\n
# keybind = ctrl+shift+Tab=text:\t

# Clear screen
# keybind = super+KeyK=clear_screen

# Reset terminal
# keybind = super+alt+KeyR=reset

# ----------------------------------------------------------------------------
# Font Size
# ----------------------------------------------------------------------------
# Increase font size
# keybind = super+Equal=increase_font_size:1
# keybind = super+shift+Equal=increase_font_size:1

# Decrease font size
# keybind = super+Minus=decrease_font_size:1

# Reset font size
# keybind = super+Digit0=reset_font_size

# ----------------------------------------------------------------------------
# Inspector & Debug
# ----------------------------------------------------------------------------
# Open cell inspector (for debugging rendering)
# keybind = super+ctrl+shift+KeyI=inspector:toggle

# Toggle terminal size display
# keybind = super+ctrl+shift+KeyS=size_display:toggle

# ----------------------------------------------------------------------------
# Quick Terminal (macOS)
# ----------------------------------------------------------------------------
# Toggle quick terminal (dropdown terminal)
# Requires quick-terminal-* settings in macos.conf
# keybind = global:f12=toggle_quick_terminal
# keybind = f11=toggle_fullscreen

# ----------------------------------------------------------------------------
# Configuration Reload
# ----------------------------------------------------------------------------
# Reload configuration files
# keybind = super+ctrl+KeyR=reload_config

# ----------------------------------------------------------------------------
# Misc Actions
# ----------------------------------------------------------------------------
# Open configuration file in editor
# keybind = super+Comma=open_config

# Toggle title bar (macOS)
# keybind = super+ctrl+KeyT=toggle_titlebar

# Toggle tab bar visibility
# keybind = super+ctrl+shift+KeyT=toggle_tab_bar

# Secure keyboard input (macOS) - prevents other apps from reading keystrokes
# keybind = super+ctrl+shift+KeyK=secure_input:toggle

# Toggle mouse reporting (allow/disallow apps from capturing mouse)
# keybind = super+ctrl+shift+KeyM=toggle_mouse_reporting

# Take screenshot of terminal
# keybind = super+ctrl+shift+KeyP=screenshot

# ----------------------------------------------------------------------------
# Custom Keybindings Examples
# ----------------------------------------------------------------------------
# You can add your own custom keybindings here.
# Examples:

# Send common commands
# keybind = ctrl+shift+KeyL=text:ls -la\n
# keybind = ctrl+shift+KeyG=text:git status\n

# Leader key pattern (tmux-style)
# keybind = ctrl+KeyA>KeyC=new_tab
# keybind = ctrl+KeyA>KeyD=new_split:right
# keybind = ctrl+KeyA>KeyX=close_surface

# Open common directories
# keybind = super+alt+KeyH=text:cd ~\n
# keybind = super+alt+KeyP=text:cd ~/Projects\n

# ----------------------------------------------------------------------------
# Disable Unwanted Keybindings
# ----------------------------------------------------------------------------
# To disable a default keybinding, bind it to 'ignore' or 'unbind'
# Examples:
# keybind = super+KeyN=ignore
# keybind = ctrl+shift+KeyT=unbind
