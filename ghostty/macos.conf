# ============================================================================
# macOS-Specific Configuration
# ============================================================================
# Platform-specific settings for Ghostty on macOS.
# These settings only apply when running Ghostty on macOS.
# Official Documentation: https://ghostty.org/docs/config/reference
# ============================================================================

# ----------------------------------------------------------------------------
# Window Appearance
# ----------------------------------------------------------------------------
# Title bar style for Ghostty windows.
# Values:
#   tabs        - Standard title bar with tab controls
#   hidden      - Hide title bar (use window chrome buttons only)
#   transparent - Transparent title bar (terminal content extends behind it)
# Default: tabs
# macos-titlebar-style = tabs

# Option/Alt key behavior.
# Values:
#   true  - Option acts as Alt modifier (for keybindings)
#   false - Option produces special characters (accents, symbols)
# Default: false (special characters)
#
# Note: This is a global setting affecting both Option keys.
# For per-key control, use macos-option-as-alt-left/right
# macos-option-as-alt = false

# Left Option key behavior (overrides macos-option-as-alt).
# Values: true (Alt), false (special characters)
# Default: Inherits from macos-option-as-alt
# macos-option-as-alt-left = false

# Right Option key behavior (overrides macos-option-as-alt).
# Values: true (Alt), false (special characters)
# Default: Inherits from macos-option-as-alt
# macos-option-as-alt-right = false

# Window color space for color rendering.
# Values:
#   srgb       - Standard RGB color space
#   display-p3 - Wide color gamut (DCI-P3)
# Default: srgb
#
# Note: display-p3 provides richer colors on compatible displays
# but may cause color accuracy issues on some systems
# window-colorspace = srgb

# Icon style in Dock and application switcher.
# Values:
#   default      - Standard Ghostty icon
#   custom:PATH  - Use custom icon from file
# Default: default
# macos-icon = default

# Icon for ghostty ghost badge in title bar (when not frontmost).
# Values:
#   true   - Show ghost icon badge
#   false  - No badge
#   PATH   - Custom badge icon
# Default: true
# macos-icon-ghost-color = true

# Icon frame style (how icon sits in Dock/app switcher).
# Values:
#   chrome  - Icon with subtle shadow/frame
#   none    - Icon only, no frame
# Default: chrome
# macos-icon-frame = chrome

# ----------------------------------------------------------------------------
# Window State & Behavior
# ----------------------------------------------------------------------------
# Save and restore window state (position, size, tabs, splits).
# Values:
#   default - Follow system preference
#   never   - Never save state
#   always  - Always save state
# Default: default
# window-save-state = default

# Window initial position (X coordinate).
# Value: Pixels from left edge of screen
# Note: Position is relative to menu bar area
# Default: System-determined
# window-position-x =

# Window initial position (Y coordinate).
# Value: Pixels from top of screen (below menu bar)
# Default: System-determined
# window-position-y =

# Allow non-native fullscreen mode.
# When true, fullscreen doesn't create a new Space.
# Default: false (use native fullscreen with Spaces)
# macos-non-native-fullscreen = false

# Auto-hide menu bar in fullscreen mode.
# Default: false
# macos-auto-hide-menu-bar = false

# ----------------------------------------------------------------------------
# Quick Terminal (Dropdown Terminal)
# ----------------------------------------------------------------------------
# The Quick Terminal is a dropdown terminal similar to iTerm2's Hotkey Window
# or Quake-style terminals. Activate via toggle_quick_terminal keybinding.

# Enable quick terminal functionality.
# Default: true
# quick-terminal = true

# Quick terminal position on screen.
# Values: top, bottom, left, right, center
# Default: top
# quick-terminal-position = top

# Quick terminal screen selection.
# Values:
#   main    - Always appear on main display
#   cursor  - Appear on display with cursor
# Default: main
# quick-terminal-screen = main

# Quick terminal animation duration (in seconds).
# Range: 0.0 (instant) to 1.0 (slow)
# Default: 0.2
# quick-terminal-animation-duration = 0.2

# Auto-hide quick terminal when it loses focus.
# Default: true
# quick-terminal-autohide = true

# Quick terminal size as percentage of screen.
# Range: 0.0 to 1.0 (0% to 100%)
# Default: 0.5 (50% of screen)
# quick-terminal-size = 0.5

# Quick terminal behavior across Spaces/virtual desktops.
# Values:
#   visible - Appear on all visible Spaces
#   all     - Appear on all Spaces (even hidden ones)
# Default: visible
# quick-terminal-space = visible

# ----------------------------------------------------------------------------
# IME (Input Method Editor)
# ----------------------------------------------------------------------------
# Show IME (Input Method) candidate window near cursor.
# Useful for CJK (Chinese, Japanese, Korean) input.
# Default: true
# macos-ime-candidate-window = true

# ----------------------------------------------------------------------------
# System Integration
# ----------------------------------------------------------------------------
# Register Ghostty as handler for terminal:// URLs.
# Allows opening terminal via URL schemes.
# Default: true
# macos-register-url-handler = true

# Secure keyboard input mode.
# When enabled, prevents other applications from reading keystrokes.
# Useful for password entry and security-sensitive operations.
# Values:
#   true   - Always enabled
#   false  - Always disabled
#   (empty) - Toggle via keybinding
# Default: false
# Toggle keybinding: secure_input:toggle
# macos-secure-input = false

# Window step resize (snap to character grid when resizing).
# When true, window resizes in increments of character cell size.
# Default: true
# window-step-resize = true

# ----------------------------------------------------------------------------
# Performance & Rendering
# ----------------------------------------------------------------------------
# Use Metal renderer instead of OpenGL (experimental).
# Default: false
# Note: Metal may provide better performance on newer Macs
# macos-use-metal = false

# ----------------------------------------------------------------------------
# Misc Behaviors
# ----------------------------------------------------------------------------
# Show window immediately (before content loads).
# Reduces perceived startup time.
# Default: true
# macos-show-window-immediately = true

# Quit Ghostty when last window closes.
# Values:
#   true  - Quit when last window closes
#   false - Keep app running (can create new windows)
# Default: false
# quit-after-last-window-closed = false

# Single instance mode (all windows in one process).
# Values:
#   true  - Single process (shares resources, faster startup)
#   false - Multiple processes (isolated, more stable)
# Default: true
# Note: This is a cross-platform setting but particularly relevant on macOS
# gtk-single-instance = true

# ----------------------------------------------------------------------------
# Desktop Notifications
# ----------------------------------------------------------------------------
# Desktop notification settings are cross-platform but commonly
# configured on macOS for better integration.

# Notify when commands complete (requires shell integration).
# Values:
#   true     - Notify for all completed commands
#   false    - Never notify
#   unfocused - Notify only when terminal is not focused
# Default: false
# desktop-notifications = false

# Minimum command duration before notification (in seconds).
# Only notify for commands running longer than this threshold.
# Default: 0 (notify for all commands)
# desktop-notifications-min-runtime = 0

# ----------------------------------------------------------------------------
# Example Quick Terminal Setup
# ----------------------------------------------------------------------------
# Uncomment these for a Quake-style dropdown terminal:
#
# quick-terminal = true
# quick-terminal-position = top
# quick-terminal-size = 0.5
# quick-terminal-animation-duration = 0.15
# quick-terminal-autohide = true
# quick-terminal-screen = cursor
#
# Add to keybinds.conf:
# keybind = global:super+Grave=toggle_quick_terminal
