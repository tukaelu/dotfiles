# See https://wiki.hyprland.org/Configuring/Monitors/
# eDP1 connected primary 2560x1440+0+0 (normal left inverted right x axis y axis) 310mm x 170mm
#monitor=,preferred,auto,auto
monitor=eDP-1,2560x1440@60.01,0x0,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = ~/.config/hypr/desktop-portals
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar -c ~/.config/waybar/config-hyprland.jsonc
exec-once = mako
exec-once = fcitx5
exec-once = nm-applet --indicator
exec-once = swayidle -w timeout 600  'env LANG=en.US_UTF-8 swaylock -f' timeout 1200 'swaymsg "output * dpms off"' resume       'swaymsg "output * dpms on"' before-sleep 'env LANG=en.US_UTF-8 swaylock -f'

exec-once = swaybg -i ~/Pictures/Wallpapers/sebastian-unrau-sp-p7uuT0tw-unsplash.jpg -m fill &

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,12
env = GTK_IM_MODULE,fcitx5
env = QT_IM_MODULE,fcitx5
env = XMODIFIERS,@im=fcitx5
env = MOZ_ENABLE_WAYLAND,1
env = WINIT_UNIX_BACKEND,x11

# General
# See https://wiki.hyprland.org/Configuring/Variables/#general
general {
  gaps_in = 5
  gaps_out = 15
  border_size = 2
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)

  cursor_inactive_timeout = 5

  layout = dwindle
}

dwindle {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

master {
  # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
  new_is_master = true
}

# Decoration
# See https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 10
  blur = true
  blur_size = 3
  blur_passes = 1
  blur_new_optimizations = on

  blurls = lockscreen

  drop_shadow = true
  shadow_range = 4
  shadow_render_power = 3
  col.shadow = rgba(1a1a1aee)
}

# Animations
# See https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
  enabled = true

  # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 7, myBezier
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
}

# Input
# See https://wiki.hyprland.org/Configuring/Variables/#input
input {
  kb_layout = us
  kb_options = ctrl:nocaps

  follow_mouse = 1

  touchpad {
      natural_scroll = true
  }

  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device:epic mouse V1 {
  sensitivity = -0.5
}

# Gestures
# See https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
  workspace_swipe = on
}

# Misc
# See https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
  disable_hyprland_logo = true
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = float, file_progress
windowrule = float, confirm
windowrule = float, dialog
windowrule = float, download
windowrule = float, notification
windowrule = float, error

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, Q,      killactive, 
bind = $mod, M,      exit, 
bind = $mod, V,      togglefloating, 
bind = $mod, P,      pseudo, # dwindle
bind = $mod, S,      togglesplit, # dwindle
bind = $mod, RETURN, exec, alacritty
bind = $mod, SPACE,  exec, wofi
bind = $mod, E,      exec, dolphin

bind = $mod CTRL, E, exec, LANG=en.US_UTF-8 wlogout
bind = $mod CTRL, L, exec, LANG=en.US_UTF-8 swaylock

# Screenshot
bind = $mod SHIFT, S, exec, grimshot --notify save output ~/Pictures/screenshot/$(date "+%Y%m%d-%H%M%S")_grim_full.png
bind = $mod SHIFT, A, exec, grimshot --notify save area   ~/Pictures/screenshot/$(date "+%Y%m%d-%H%M%S")_grim_area.png
bind = $mod SHIFT, W, exec, grimshot --notify save window ~/Pictures/screenshot/$(date "+%Y%m%d-%H%M%S")_grim_window.png

# Thinkpad X1 Carbon Gen6 (2018) Specific binds
bind = ,XF86AudioMute,         exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = ,XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bind = ,XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bind = ,XF86AudioMicMute,      exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 2%-
bind = ,XF86MonBrightnessUp,   exec, brightnessctl set 2%+

# Move focus with mainMod + arrow keys
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move window
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
