# herdr configuration

onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+t"

# General
help = "prefix+?"
settings = "prefix+,"
detach = "prefix+q"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+o"

# Workspace
workspace_picker = "prefix+s"
# goto = "prefix+g"
new_workspace = "cmd+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
rename_workspace = "prefix+shift+s"
close_workspace = "cmd+shift+w"
# previous_workspace = "" # optional, unset by default
# next_workspace = ""     # optional, unset by default
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"

# Agent
previous_agent = "cmd+shift+k"     # optional, unset by default
next_agent = "cmd+shift+j"         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste

# Tab
new_tab = "cmd+t"
rename_tab = "prefix+shift+t"
previous_tab = "cmd+shift+h"
next_tab = "cmd+shift+l"
# switch_tab = "prefix+1..9"
close_tab = ["prefix+shift+x", "cmd+w"]

# Pane
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"       # legacy alias: fullscreen
# resize_mode = "prefix+r"

# Sidebar
toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# navigate_pane_left = "h"      # left arrow always focuses the pane to the left
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36

mouse_capture = true
mouse_scroll_lines = 3

confirm_close = true
prompt_new_tab_name = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

accent = "cyan"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#98bb6c", dim = false }],
]

[ui.sidebar.spaces]
row_gap = 0

# Background notification popup delivery
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
cjk_ime_cursor_shape = "steady_block"

[advanced]
scrollback_limit_bytes = 10000000
